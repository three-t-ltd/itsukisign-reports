<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資料アーカイブ｜株式会社樹サイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F5F1E8;color:#1E3A2B;font-family:'Noto Sans JP',sans-serif;line-height:1.7}
header{background:#1E3A2B;color:#F4E9D8;padding:44px 20px 38px}
header .in{max-width:880px;margin:0 auto}
h1{font-family:'Noto Serif JP',serif;font-size:26px;font-weight:900;letter-spacing:.04em;margin-bottom:8px}
.sub{font-size:13.5px;color:#C9D4CC}
main{max-width:880px;margin:0 auto;padding:34px 20px 80px}
.card{display:block;background:#fff;border:1px solid #C9D4CC;border-left:5px solid #1E3A2B;border-radius:5px;padding:20px 22px;margin-bottom:14px;text-decoration:none;color:inherit;transition:.15s}
.card:hover{box-shadow:0 6px 18px rgba(30,58,43,.14);transform:translateY(-1px)}
.card h2{font-family:'Noto Serif JP',serif;font-size:17px;margin-bottom:4px}
.card .meta{font-size:12.5px;color:#5C6B60}
.lock{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:#9B4527;border-radius:3px;padding:1px 8px;margin-left:8px;vertical-align:2px}
footer{max-width:880px;margin:0 auto;padding:0 20px 40px;font-size:12.5px;color:#5C6B60}
</style>
</head>
<body>
<header><div class="in">
<h1>株式会社樹サイン 資料アーカイブ</h1>
<div class="sub">three.T合同会社</div>
</div></header>
<main>
<a class="card" href="./kintone-schedule/">
<h2>kintone導入 フェーズスケジュール<span class="lock">要パスワード</span></h2>
<div class="meta">2026年8月〜12月／2026年7月28日 定例MTGの決定にもとづく</div>
</a>
</main>
<footer>各資料にはパスワードが設定されています。パスワードは担当者からお知らせします。</footer>
</body>
</html>
